apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhttp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jhttp
  template:
    metadata:
      labels:
        app: jhttp
    spec:
      containers:
        - name: jhttp
          image: amotani/jhttp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
